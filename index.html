<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>知乎短篇爆款小说工作台</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7c3aed">
<link rel="apple-touch-icon" href='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 192 192%27%3E%3Crect width=%27192%27 height=%27192%27 rx=%2736%27 fill=%27%237c3aed%27/%3E%3Ctext x=%2796%27 y=%27124%27 font-size=%2796%27 text-anchor=%27middle%27%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E'>
<link rel="manifest" href='data:application/manifest+json,{"name":"知乎短篇爆款小说工作台","short_name":"小说台","start_url":"index.html","scope":"./","display":"standalone","background_color":"%23ffffff","theme_color":"%237c3aed","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 192 192%27%3E%3Crect width=%27192%27 height=%27192%27 rx=%2736%27 fill=%27%237c3aed%27/%3E%3Ctext x=%2796%27 y=%27124%27 font-size=%2796%27 text-anchor=%27middle%27%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E","sizes":"192x192","type":"image/svg+xml"}]}'>
<style>
:root{--p:#7c3aed;--pd:#6d28d9;--bg:#f5f4f8;--txt:#1f2937;--sub:#6b7280;--line:#e9e6f0;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--chip:#f3e8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
#lock{position:fixed;inset:0;z-index:999;background:linear-gradient(135deg,#7c3aed,#4f46e5);display:flex;align-items:center;justify-content:center;padding:24px}
#lock.hide{display:none}
.lbox{width:100%;max-width:320px;text-align:center;color:#fff}
.lbox .ico{font-size:52px;margin-bottom:8px}
.lbox h2{margin:0 0 6px;font-size:19px}
.lbox p{margin:0 0 20px;font-size:12px;opacity:.85}
.lbox input{width:100%;padding:13px;text-align:center;font-size:16px;border:none;border-radius:12px;outline:none;color:var(--txt)}
.lbox button{margin-top:12px;width:100%;padding:13px;font-size:15px;font-weight:700;border:none;border-radius:12px;background:#fff;color:var(--pd);cursor:pointer}
#perr{margin-top:12px;font-size:13px;color:#ffe4e6;min-height:18px;font-weight:600}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.app.hide{display:none}
header{background:linear-gradient(135deg,var(--p),#4f46e5);color:#fff;padding:11px 14px}
header h1{margin:0;font-size:16px}
.hmeta{font-size:11px;opacity:.92;margin-top:3px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hmeta a{color:#fff;text-decoration:underline;font-size:11px;cursor:pointer;opacity:.95}
main{flex:1;padding:12px;padding-bottom:84px}
.sec{display:none}.sec.on{display:block}
.card,.blk{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:11px}
.blk h3{margin:0 0 8px;font-size:14px}
.blk h3 .sub{font-size:11px;color:var(--sub);font-weight:400}
.pname{font-size:15px;font-weight:700;margin:2px 0}
.btn{font-size:12px;padding:7px 11px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--txt);cursor:pointer}
.btn.p{background:var(--p);color:#fff;border-color:var(--p)}
.btn.g{background:#10b981;color:#fff;border-color:#10b981}
.btn.s{background:#faf9fc}
.btn.dg{color:var(--bad);border-color:#fecaca}
.btn:active{transform:scale(.97)}
.b{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:600;display:inline-block;margin:1px 2px 1px 0}
.b.ok{background:#dcfce7;color:var(--ok)}.b.warn{background:#fef3c7;color:var(--warn)}
.b.bad{background:#fee2e2;color:var(--bad)}.b.p{background:var(--chip);color:var(--pd)}
.b.gray{background:#f1f5f9;color:#475569}
.sm{font-size:11px;color:var(--sub)}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px dashed var(--line);gap:8px;align-items:center}
.empty{text-align:center;color:var(--sub);padding:28px 10px;font-size:13px}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff;color:var(--txt)}
textarea{min-height:88px;resize:vertical;line-height:1.6}
label{font-size:11px;color:var(--sub);display:block;margin:9px 0 3px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:40}
nav a{flex:1;text-align:center;padding:7px 0 5px;font-size:10px;color:var(--sub);cursor:pointer}
nav a .ic{font-size:18px;display:block;line-height:1}
nav a.on{color:var(--p);font-weight:700}
.tag{display:inline-block;font-size:11px;background:var(--chip);color:var(--pd);padding:3px 8px;border-radius:6px;margin:2px;cursor:pointer}
.tag:hover{filter:brightness(.96)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:60;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.sheet{background:#fff;width:100%;max-width:480px;max-height:86vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px}
.warnbox{background:#fffbeb;border:1px solid #fde68a;border-radius:9px;padding:9px;font-size:11.5px;color:#92400e;line-height:1.6;margin:8px 0}
.ev{background:#faf9fc;border-left:3px solid var(--p);padding:9px 11px;border-radius:6px;font-size:12.5px;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
.subtabs{display:flex;gap:4px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.subtabs button{flex:0 0 auto;font-size:11px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--sub);cursor:pointer;white-space:nowrap}
.subtabs button.on{background:var(--p);color:#fff;border-color:var(--p);font-weight:700}
.genre{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.genre button{font-size:11px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--sub);cursor:pointer}
.genre button.on{background:var(--chip);color:var(--pd);border-color:var(--p);font-weight:700}
.mtbl{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px}
.mtbl th,.mtbl td{border:1px solid var(--line);padding:6px 7px;text-align:left;vertical-align:top}
.mtbl th{background:#faf9fc;color:var(--sub);font-weight:600}
.mtbl tr th:first-child{width:64px}
.mcard{border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:9px;background:#fff}
.mcard .mt{font-weight:700;font-size:13px;margin-bottom:4px}
.mcard .mf{font-size:12px;color:var(--txt);line-height:1.55;white-space:pre-wrap;word-break:break-word}
.mcard .meta{font-size:10.5px;color:var(--sub);margin-top:5px}
.promptbox{background:#0f172a;color:#e2e8f0;border-radius:9px;padding:10px;font-size:11.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.prow b{font-size:12.5px}
</style>
</head>
<body>

<div id="lock"><div class="lbox">
<div class="ico">🔒</div><h2>知乎短篇爆款小说工作台</h2><p>请输入访问密码</p>
<input type="password" id="pw" placeholder="访问密码" onkeydown="if(event.key==='Enter')doUnlock()">
<button onclick="doUnlock()">解 锁</button><div id="perr"></div>
</div></div>

<div class="app hide" id="app">
<header><h1>📖 知乎短篇爆款小说工作台</h1>
<div class="hmeta"><span id="hmeta">加载中…</span><a onclick="switchProj()">切换项目</a></div></header>
<main>

<!-- ① 脑洞策划 -->
<section class="sec on" id="s-brain">
  <div class="acts" style="margin:0 0 11px"><button class="btn p" onclick="newProject()">＋ 新建小说</button>
  <button class="btn" onclick="exportAll()">导出备份</button>
  <button class="btn" onclick="document.getElementById('impf').click()">导入备份</button></div>
  <input type="file" id="impf" accept=".json" style="display:none" onchange="importAll(this)">
  <div id="plist"></div>
  <div id="brainBody"></div>
</section>

<!-- ② 正文生成 -->
<section class="sec" id="s-body"><div id="bodyBody"></div></section>

<!-- ③ 素材库 -->
<section class="sec" id="s-mat">
  <div class="subtabs" id="matTabs"></div>
  <div id="matBody"></div>
</section>

<!-- ④ 诊断优化 -->
<section class="sec" id="s-diag"><div id="diagBody"></div></section>

<!-- ⑤ 版本管理 -->
<section class="sec" id="s-ver"><div id="verBody"></div></section>

<!-- ⑥ 设置 -->
<section class="sec" id="s-set"><div id="setBody"></div></section>

</main>
<nav>
<a class="on" data-t="brain"><span class="ic">💡</span>脑洞</a>
<a data-t="body"><span class="ic">✍️</span>正文</a>
<a data-t="mat"><span class="ic">🗂</span>素材</a>
<a data-t="diag"><span class="ic">🔧</span>诊断</a>
<a data-t="ver"><span class="ic">📚</span>版本</a>
<a data-t="set"><span class="ic">⚙️</span>设置</a>
</nav>
</div>
<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>

<script>
const PWD_KEY="novel_pwd",UNLOCK="novel_studio_unlocked",PWD_DEF="123456",AI_KEY="novel_ai_cfg";
let DATA={styles:[],quickFixes:[],apiDefaults:{},matSeeds:null};
let projects=[],curId=null,materials={ideas:[],favs:[]},db=null,curMat="bao";

/* ===== IndexedDB ===== */
function idb(){return new Promise((res,rej)=>{if(db)return res(db);
 const r=indexedDB.open("zhihu-novel-studio",1);
 r.onupgradeneeded=e=>{const d=e.target.result;
  if(!d.objectStoreNames.contains("projects"))d.createObjectStore("projects",{keyPath:"id"});
  if(!d.objectStoreNames.contains("meta"))d.createObjectStore("meta",{keyPath:"k"});};
 r.onsuccess=e=>{db=e.target.result;res(db);};r.onerror=rej;});}
function tx(store,mode){return idb().then(d=>d.transaction(store,mode).objectStore(store));}
function put(o){return tx("projects","readwrite").then(s=>new Promise((res,rej)=>{const q=s.put(o);q.onsuccess=res;q.onerror=rej;}));}
function del(id){return tx("projects","readwrite").then(s=>new Promise((res,rej)=>{const q=s.delete(id);q.onsuccess=res;q.onerror=rej;}));}
function getAll(){return tx("projects","readonly").then(s=>new Promise(res=>{const q=s.getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([]);}));}
function setMeta(k,v){return tx("meta","readwrite").then(s=>new Promise((res,rej)=>{const q=s.put({k,v});q.onsuccess=res;q.onerror=rej;}));}
function getMeta(k,def){return tx("meta","readonly").then(s=>new Promise(res=>{const q=s.get(k);q.onsuccess=()=>res(q.result?q.result.v:def);q.onerror=()=>res(def);}));}

/* ===== 工具 ===== */
function now(){const d=new Date(),z=n=>String(n).padStart(2,"0");
 return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())+" "+z(d.getHours())+":"+z(d.getMinutes());}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function cw(t){return (t||"").replace(/\s/g,"").length;}
function cp(){return projects.find(p=>p.id===curId);}
function save(p){p.updatedAt=now();return put(p);}
let tt;function toast(m){let e=document.getElementById("toast");
 if(!e){e=document.createElement("div");e.id="toast";e.style.cssText="position:fixed;left:50%;top:22%;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;z-index:9999";document.body.appendChild(e);}
 e.textContent=m;e.style.display="block";clearTimeout(tt);tt=setTimeout(()=>e.style.display="none",1700);}

/* ===== 密码锁 ===== */
function doUnlock(){const v=document.getElementById("pw").value;
 const cur=localStorage.getItem(PWD_KEY)||PWD_DEF;
 if(v===cur){localStorage.setItem(UNLOCK,"1");if(!localStorage.getItem(PWD_KEY))localStorage.setItem(PWD_KEY,PWD_DEF);
  document.getElementById("perr").textContent="";enter();}
 else{document.getElementById("perr").textContent="密码错误";document.getElementById("pw").value="";}}
function lockNow(){if(confirm("锁定后需重新输入密码，确定？")){localStorage.removeItem(UNLOCK);location.reload();}}
function setPwd(){const v=document.getElementById("npw").value.trim();if(!v){toast("请输入新密码");return;}
 localStorage.setItem(PWD_KEY,v);document.getElementById("npw").value="";toast("密码已更新 ✔");}
function enter(){document.getElementById("lock").classList.add("hide");document.getElementById("app").classList.remove("hide");boot();}

/* ===== 启动 ===== */
async function boot(){
 try{const r=await fetch("./data.json?t="+Date.now(),{cache:"no-store"});
  if(r.ok){DATA=await r.json();localStorage.setItem("novel_data_cache",JSON.stringify(DATA));}}
 catch(e){try{const c=localStorage.getItem("novel_data_cache");if(c)DATA=JSON.parse(c);}catch(e2){}}
 if(!DATA.matSeeds)DATA.matSeeds=SEED;
 projects=await getAll();
 const m=await getMeta("materials",{ideas:[],favs:[]});materials={ideas:m.ideas||[],favs:m.favs||[]};
 const last=await getMeta("lastId",null);
 if(last&&projects.find(p=>p.id===last))curId=last;
 const cfg=JSON.parse(localStorage.getItem(AI_KEY)||"null");
 if(cfg){aurl.value=cfg.url||"";amodel.value=cfg.model||"";amax.value=cfg.max||32768;}
 renderAll();
}
function renderAll(){renderProjects();renderBrain();renderBody();renderMat();renderDiag();renderVer();renderSet();updMeta();}
function updMeta(){const p=cp();
 document.getElementById("hmeta").textContent=(projects.length?("项目 "+projects.length+" · "):"")+(p?("当前："+p.title):"未选项目");}

/* ===== Tab 状态机（修复栏目点击无法切换） ===== */
document.querySelectorAll("nav a").forEach(a=>a.onclick=()=>switchTab(a.dataset.t));
function switchTab(t){
 document.querySelectorAll("nav a").forEach(x=>x.classList.toggle("on",x.dataset.t===t));
 document.querySelectorAll(".sec").forEach(s=>s.classList.remove("on"));
 const sec=document.getElementById("s-"+t);if(sec)sec.classList.add("on");
 if(t==="brain")renderBrain();else if(t==="body")renderBody();else if(t==="mat")renderMat();
 else if(t==="diag")renderDiag();else if(t==="ver")renderVer();else if(t==="set")renderSet();
 window.scrollTo(0,0);
}
function switchProj(){switchTab("brain");toast("在「脑洞」里新建或选择项目");}

/* ===== 项目 ===== */
function newProject(){
 const p={id:uid(),title:"未命名小说",genre:"都市",target:20000,ending:"HE",status:"草稿",
  createdAt:now(),updatedAt:now(),idea:{raw:"",assess:null,final:""},outlines:[],selOutline:null,
  mss:[],diags:[],versions:[],constraints:[]};
 projects.unshift(p);curId=p.id;save(p);setMeta("lastId",p.id);
 renderProjects();switchTab("brain");toast("已创建，先填写脑洞");}
function openProj(id){curId=id;setMeta("lastId",id);renderAll();switchTab("brain");updMeta();}
function renProj(id){const p=projects.find(x=>x.id===id);const t=prompt("标题",p.title);
 if(t){p.title=t;save(p);renderProjects();updMeta();}}
function delProj(id){if(!confirm("删除这部小说？所有稿件与版本都会消失"))return;
 projects=projects.filter(x=>x.id!==id);del(id);if(curId===id)curId=null;renderAll();}
function renderProjects(){const box=document.getElementById("plist");
 if(!projects.length){box.innerHTML='<div class="empty">还没有小说，点上面「＋ 新建小说」开始</div>';return;}
 box.innerHTML=projects.map(p=>{const st=p.status==="在用"?"ok":p.status==="归档废弃"?"gray":"warn";
  const wc=p.mss.length?p.mss[p.mss.length-1].words:0;
  return '<div class="card" onclick="openProj(\''+p.id+'\')"><div style="display:flex;justify-content:space-between;align-items:flex-start">'
  +'<div><div class="pname">'+esc(p.title)+'</div><div class="sm">'+esc(p.genre)+' · '+p.ending+' · 目标'+p.target+'字</div></div>'
  +'<span class="b '+st+'">'+p.status+'</span></div>'
  +'<div class="sm" style="margin-top:6px">大纲 '+p.outlines.length+' · 正文 '+p.mss.length+' · 版本 '+p.versions.length+' · '+wc+' 字</div>'
  +'<div class="sm">更新 '+(p.updatedAt||"")+'</div><div class="acts">'
  +'<button class="btn s" onclick="event.stopPropagation();openProj(\''+p.id+'\')">进入</button>'
  +'<button class="btn s" onclick="event.stopPropagation();renProj(\''+p.id+'\')">重命名</button>'
  +'<button class="btn dg" onclick="event.stopPropagation();delProj(\''+p.id+'\')">删除</button></div></div>';}).join("");}

/* ===== 提示词模板（全部可直接复制粘贴给 WorkBuddy 执行） ===== */
function fmtOutline(o){return "# 方案"+o.code+" 【"+(o.name||"")+"】\n\n## 核心看点\n"+(o.points||[]).map(x=>"- "+x).join("\n")
 +"\n\n## 完整故事大纲\n"+(o.outline||"")+"\n\n## 人物设定卡\n"+(o.chars||"")
 +"\n\n## 故事梗概\n"+(o.synopsis||"")+"\n\n## 开篇钩子\n"+(o.hook||"");}
function cons(p){return (p.constraints&&p.constraints.length)?"\n\n【本项目已积累的规避约束，必须遵守】\n"+p.constraints.map(c=>"- "+c).join("\n"):"";}
const T={
/* 提示词0 总控入口 */
0:`【角色】知乎盐选短篇小说工作台总控Agent
【Tab状态管理规则，强制遵守】
当前激活Tab：{{激活Tab名称：脑洞策划 / 正文生成 / 素材库 / 诊断优化 / 版本管理 / 设置}}
1. 严格按照激活Tab输出对应模块内容；用户点击切换Tab，立刻切换模块，禁止混杂其他Tab输出内容，解决栏目点击无法切换的问题。
2. 不允许跨Tab输出无关产物；用户指令明确指向某Tab，自动更新激活Tab。
3. 全局持久保存：全部脑洞、方案、稿件、版本记录、素材收藏，维护完整上下文，不丢失历史数据。
4. 全局约束：拒绝AI悬浮套路，人物行为必须有动机；禁止廉价抒情套话；手机阅读友好，短段落。

【全部Tab能力说明】
1.脑洞策划：脑洞评估、生成2套差异化故事方案（大纲/人设/梗概/开篇钩子）
2.正文生成：选定方案，三选一风格输出完整短篇，附带稿件自评
3.素材库：爆款文档拆解、脑洞灵感池、风格样本库、爆点标签库、开篇钩子库；支持筛选题材、收藏、一键复用素材到脑洞策划
4.诊断优化：接收编辑反馈，定位问题点、输出落地优化策略、局部/全文重写、输出同类问题规避指令
5.版本管理：新建版本、保存版本记录、按版本号回退完整产物、归档废弃稿件，输出markdown版本记录表
6.设置：自定义参数、导出全部工作产物、清空缓存

用户接下来指令：{{用户输入}}`,
/* 提示词6 脑洞质量评估（前置） */
assess:p=>`【知乎短篇脑洞评估】
用户脑洞：${(p.idea.final||p.idea.raw||"")}
题材：${p.genre}

输出：
1.脑洞吸引力评分（0-10分）
2.优势点：哪些元素适配知乎爆款流量
3.风险短板：哪些地方容易写崩（逻辑坑、俗套、难落地、容易AI化）
4.优化建议：给2条脑洞改良方向，可以让故事冲突更强，更适合知乎短篇。`,
/* 提示词1 脑洞解析与多方案大纲生成 */

function pb2(id,label,pstr){return promptBlock(id,label,pstr);}
function markChips(){const p=cp();if(!p)return;

function saveBrain(){const p=cp();p.target=+document.getElementById("f_target").value||20000;
 p.idea.raw=document.getElementById("f_raw").value;save(p);renderBrain();toast("已保存");updMeta();}
function saveFinalBrain(){const p=cp();p.idea.final=document.getElementById("f_final").value;save(p);
 if(!p.outlines.length)toast("定稿已保存，可生成方案");else renderBrain();}
function selOut(c){const p=cp();p.selOutline=c;save(p);renderBrain();toast("已选定方案 "+c);}
function delOut(i){const p=cp();p.outlines.splice(i,1);
 if(p.selOutline&&!p.outlines.find(o=>o.code===p.selOutline))p.selOutline=null;save(p);renderBrain();}

 let h='<div class="blk"><h3>③ 正文生成 <span class="sub">· 提示词2 多风格正文</span></h3>'

  +'<div class="acts"><button class="btn p" onclick="syncStyle()">生成提示词</button>'
  +pb2("ptBody","复制正文提示词",T.body(p,"A"))
  +'<button class="btn s" onclick="gen(\'body\')">🤖 直接生成</button>'
  +'<button class="btn s" onclick="pasteBox(\'ms\')">📥 粘贴正文</button></div></div>';
 if(p.mss.length){h+='<div class="blk"><h3>已有正文（'+p.mss.length+' 稿）</h3>'
  +p.mss.map((m,i)=>'<div class="kv"><span>风格 '+m.style+' · '+m.words+' 字 · '+esc(m.at)+'</span><span>'

  const ms=p.mss[p.mss.length-1];

  +'<button class="btn" onclick="expMd()">导出 Markdown</button></div>'
  +'<div class="sm" id="wc">'+ms.words+' 字</div></div>';}
 box.innerHTML=h;
 const ed=document.getElementById("edms");if(ed)ed.oninput=()=>document.getElementById("wc").textContent=cw(ed.value)+" 字";
}
function syncStyle(){const s=document.getElementById("f_style").value;

function saveMs(){const p=cp(),t=document.getElementById("edms").value,m=p.mss[p.mss.length-1];

 save(p);renderProjects();updMeta();toast("已保存");}

  +'<div class="ev" style="margin-top:8px;max-height:48vh">'+esc(m.text)+'</div>'

function expMd(){const p=cp(),ms=p.mss[p.mss.length-1];if(!ms){toast("无正文");return;}

function dl(name,content){const b=new Blob([content],{type:"text/plain;charset=utf-8"});

function saveVer(kind){const p=cp();const note=(document.getElementById("f_note")||{}).value||"";

 let a=parseInt(last,10),b=parseInt((last.split(".")[1]||"0"),10);
 if(kind==="minor")b++;else{a++;b=0;}
 const nv=a+"."+b;

/* ===== 解析与保存 ===== */
function sec(b,n){const re=new RegExp("##\\s*"+n+"[\\s\\S]*?\\n([\\s\\S]*?)(?=\\n##\\s|$)");const m=b.match(re);return m?m[1].trim():"";}
function applyResult(kind,txt){const p=cp();let msg="";
 if(kind==="assess"){const m=txt.match(/(\d{1,2}(?:\.\d)?)\s*\/?\s*10/);
  p.idea.assess={score:m?m[1]:"—",text:txt};if(!p.idea.final)p.idea.final=p.idea.raw;msg="评估已保存";}
 else if(kind==="outline"){const blocks=txt.split(/(?=#\s*方案)/).filter(b=>b.trim());let n=0;
  blocks.forEach(b=>{const code=(b.match(/#\s*方案\s*([AB])/)||[])[1]||String.fromCharCode(65+p.outlines.length);
   const o={code,name:((b.match(/#\s*方案[AB]\s*【?([^】\n]*)】?/)||[])[1]||"").trim(),
    points:(sec(b,"核心看点")||"").split("\n").map(s=>s.replace(/^[-•\d.\s]*/,"").trim()).filter(Boolean),
    outline:sec(b,"完整故事大纲")||sec(b,"故事大纲"),chars:sec(b,"人物设定卡")||sec(b,"人物卡"),
    synopsis:sec(b,"故事梗概"),hook:sec(b,"开篇钩子")};
   const i=p.outlines.findIndex(x=>x.code===o.code);if(i>=0)p.outlines[i]=o;else p.outlines.push(o);n++;});

async function callAPI(c,messages,onDelta,maxTok){
 const url=(c.url||"")+"/chat/completions";let resp;
 try{const hd={"Content-Type":"application/json"};
  if(c.key)hd["Authorization"]="Bearer "+c.key;
  if(c.relay)hd["X-Relay-Secret"]=c.relay;
  resp=await fetch(url,{method:"POST",headers:hd,
  body:JSON.stringify({model:c.model,messages,stream:!!onDelta,max_tokens:maxTok||c.max||32768})});}
 catch(e){const isCors=/Failed to fetch|NetworkError|Cross-Origin|CORS|load failed/i.test(e.message);
  if(isCors)throw new Error("CORS/网络失败：浏览器直连被跨域预检拦截（日日新对 OPTIONS 返回 404）。两种方案：①改用「复制提示词→去 WorkBuddy 执行→贴回本 App」模式（零风险，手机端可用）；②自建 CORS 转发（见「设置→跨域帮助」）。");
  throw new Error("网络失败："+e.message);}
 if(!resp.ok){let m=""+resp.status;try{const j=await resp.json();if(j.error&&j.error.message)m+=" "+j.error.message;}catch(e){}
  if(resp.status===401)throw new Error("401 Key 无效或已过期");
  if(resp.status===429)throw new Error("429 触发限流，请稍后再试");
  throw new Error(m);}
 if(!onDelta){const j=await resp.json();return ((j.choices&&j.choices[0]&&j.choices[0].message)||{}).content||"";}
 const rd=resp.body.getReader(),dec=new TextDecoder();let out="";
 for(;;){const {done,value}=await rd.read();if(done)break;const chunk=dec.decode(value,{stream:true});
  chunk.split("\n").forEach(line=>{line=line.trim();if(!line.startsWith("data:"))return;const p=line.slice(5).trim();
   if(p==="[DONE]")return;try{const j=JSON.parse(p);const d=j.choices&&j.choices[0]&&j.choices[0].delta;
    if(d&&d.content){out+=d.content;onDelta(out);}}catch(e){}});}
 return out;}

function showCorsHelp(){
 const code=`// Cloudflare Workers CORS 转发（加固版）
// 用法 A（默认）：App 在 Authorization 带自己的 Key，Worker 原样转发。
// 用法 B（更安全）：设环境变量 SEN_NOVA_KEY，App 不发送 Key，Worker 自动补 Authorization，密钥永不离开服务端。
// 安全：设环境变量 RELAY_SECRET，App 在请求头带 X-Relay-Secret 才放行，防止公网 URL 被当开放代理刷额度。

const UPSTREAM = "https://token.sensenova.cn";

export default {
  async fetch(request, env) {
    const secret = env.RELAY_SECRET;
    if (secret && request.headers.get("X-Relay-Secret") !== secret) {
      return new Response("forbidden", { status: 403 });
    }
    const url = new URL(request.url);
    const target = UPSTREAM + url.pathname + url.search;

    const headers = new Headers(request.headers);
    headers.delete("origin");
    headers.delete("referer");
    if (env.SEN_NOVA_KEY) headers.set("Authorization", "Bearer " + env.SEN_NOVA_KEY);

    if (request.method === "OPTIONS") {
      return new Response(null, { status: 204, headers: corsHeaders() });
    }
    try {
      const r = await fetch(target, { method: request.method, headers, body: request.body, redirect: "follow" });
      const h = new Headers(r.headers);
      for (const [k, v] of corsHeaders()) h.set(k, v);
      return new Response(r.body, { status: r.status, statusText: r.statusText, headers: h });
    } catch (e) {
      return new Response(JSON.stringify({ error: e.message }), {
        status: 502,
        headers: Object.assign(Object.fromEntries(corsHeaders()), { "Content-Type": "application/json" })
      });
    }
  }
};

function corsHeaders() {
  return new Headers({
    "Access-Control-Allow-Origin": "*",
    "Access-Control-Allow-Methods": "GET, POST, OPTIONS",
    "Access-Control-Allow-Headers": "Content-Type, Authorization, X-Requested-With, X-Relay-Secret",
    "Access-Control-Max-Age": "86400"
  });
}`;
 showSheet("🌐 跨域预检被拦截 · 解决方案",
  '<div class="sm">日日新接口对 OPTIONS 预检返回 404，浏览器会拦截带 Authorization 的请求。你有两个选择：</div>'
  +'<div class="blk"><h3>① 零风险：复制粘贴模式（当前兜底）</h3>'
  +'<div class="sm">不配置任何转发。在每个 Tab 点「复制提示词」→ 去 WorkBuddy（电脑端）执行 → 把结果「粘贴」回本 App。密钥只在本机/WorkBuddy，绝不外泄。缺点：需手动往返。</div></div>'
  +'<div class="blk"><h3>② 最优：自建转发 + 模式 B（推荐）</h3>'
  +'<div class="sm">把 Base URL 改为你自己的转发地址，App 内直接调用 AI、自动存稿。唯一风险是转发公网 URL 泄露被刷额度，已用共享密钥（RELAY_SECRET）堵死；还可用「密钥托管」让 Key 永不进浏览器。下方为加固脚本。</div>'
  +'<details style="margin-top:8px"><summary>展开 Cloudflare Workers 脚本</summary>'
  +'<pre style="white-space:pre-wrap;font-size:12px;background:#f4f4f5;padding:8px;border-radius:6px;max-height:38vh;overflow:auto">'+esc(code)+'</pre>'
  +'<div class="acts" style="margin-top:6px"><button class="btn p" onclick="copyText(\'corsCode\')">复制脚本</button></div>'
  +'<span id="corsCode" style="display:none">'+esc(code)+'</span></div></div>'
  +'<div class="sm" style="margin-top:6px">⚠️ 切勿使用任何「公共 CORS 代理」，密钥会经第三方。</div>'
  +'<div class="acts"><button class="btn" onclick="closeSheet()">关闭</button></div>');
}
